AWSTemplateFormatVersion: "2010-09-09"
Description: Edge Vision Benchmark Console on AWS App Runner
Parameters:
  ServiceName:
    Type: String
  ImageIdentifier:
    Type: String
Resources:
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-ecr-access"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: EDGE_VISION_ROOT
                Value: /app
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /ready
        Interval: 10
        Timeout: 5
        HealthyThreshold: 2
        UnhealthyThreshold: 5
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
      Tags:
        - { Key: Path, Value: ai-engineer }
        - { Key: Plan, Value: "04" }
        - { Key: Project, Value: "24" }
Outputs:
  ServiceUrl:
    Value: !GetAtt Service.ServiceUrl
