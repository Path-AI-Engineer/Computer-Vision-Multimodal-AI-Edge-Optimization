[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-breed-classification-studio"
version = "1.0.0"
description = "Evidence-first fine-grained visual classification API and studio."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "joblib==1.4.2",
  "numpy==1.26.4",
  "pillow==10.4.0",
  "pydantic==2.13.4",
  "scikit-image==0.24.0",
  "scikit-learn==1.7.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.14.10"]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
