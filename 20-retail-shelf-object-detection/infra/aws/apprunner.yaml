AWSTemplateFormatVersion: "2010-09-09"
Description: Retail Shelf Detection Console on AWS App Runner

Parameters:
  ServiceName:
    Type: String
    Default: ai-04-p20-shelf-detection-console
  ImageIdentifier:
    Type: String
    Description: Immutable private ECR image URI including its tag

Resources:
  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-ecr-access"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Tags:
        - Key: Path
          Value: ai-engineer
        - Key: Plan
          Value: "04"
        - Key: Project
          Value: "20"

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: SHELF_CONSOLE_ROOT
                Value: /app
              - Name: MAX_BATCH_SIZE
                Value: "4"
              - Name: MAX_UPLOAD_BYTES
                Value: "8388608"
      InstanceConfiguration:
        Cpu: "1 vCPU"
        Memory: "2 GB"
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /ready
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - Key: Path
          Value: ai-engineer
        - Key: Plan
          Value: "04"
        - Key: Project
          Value: "20"
        - Key: Environment
          Value: portfolio

Outputs:
  ServiceArn:
    Value: !GetAtt Service.ServiceArn
  ServiceUrl:
    Value: !GetAtt Service.ServiceUrl
