services:
  shelf-console:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
    image: retail-shelf-detection-console:local
    environment:
      PORT: "8080"
      SHELF_CONSOLE_ROOT: /app
    ports:
      - "8020:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
