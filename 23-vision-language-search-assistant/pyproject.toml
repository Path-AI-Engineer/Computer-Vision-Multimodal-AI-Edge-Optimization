[project]
name = "vision-language-search-assistant"
version = "1.0.0rc1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "numpy==1.26.4",
  "pillow==10.4.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "ruff==0.14.10",
]
research = [
  "faiss-cpu==1.8.0.post1",
  "open-clip-torch==2.29.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

